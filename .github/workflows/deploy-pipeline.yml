name: Build, Deploy, and Test E-commerce Integration

on:
  push:
    branches:
      - main

env:
  RESOURCE_GROUP: 'rg-ecommerce-prod'
  # Define all three function app names
  ORDER_API_NAME: 'ecom52ekuuuicvepu-api'
  CATALOG_API_NAME: 'ecom52ekuuuicvepu-catalog-api'
  WMS_API_NAME: 'ecom52ekuuuicvepu-wms-api'
  # Define all three source paths
  ORDER_API_PATH: './src/api/OrderApi'
  CATALOG_API_PATH: './src/api/CatalogApi'
  WMS_API_PATH: './src/api/WmsApi'
  BICEP_FILE_PATH: './infra/main.bicep'

jobs:
  build-and-test:
    name: Build and Test .NET Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Build all three APIs
      - name: Build Order API
        run: dotnet build ${{ env.ORDER_API_PATH }} --configuration Release

      - name: Build Catalog API
        run: dotnet build ${{ env.CATALOG_API_PATH }} --configuration Release

      - name: Build WMS API
        run: dotnet build ${{ env.WMS_API_PATH }} --configuration Release

      - name: Generate Catalog database migration script
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project "$CATALOG_API_PATH" --configuration Release --no-build
          dotnet ef migrations script --idempotent --project "$CATALOG_API_PATH" --configuration Release --no-build --output ./publish/database/catalog.sql

      - name: Upload Catalog database migration
        uses: actions/upload-artifact@v4
        with:
          name: catalog-db-migrations
          path: ./publish/database/catalog.sql
          if-no-files-found: error

      # Run Unit Tests (Assuming you add a CatalogApi test project later)
      - name: Run Unit Tests
        run: |
          dotnet test ./tests/OrderApi.Tests/OrderApi.Tests.csproj --configuration Release
          dotnet test ./tests/WmsApi.Tests/WmsApi.Tests.csproj --configuration Release

      - name: Publish Order API
        run: dotnet publish ${{ env.ORDER_API_PATH }} --configuration Release --output ./publish/OrderApi

      - name: Publish Catalog API
        run: dotnet publish ${{ env.CATALOG_API_PATH }} --configuration Release --output ./publish/CatalogApi

      - name: Publish WMS API
        run: dotnet publish ${{ env.WMS_API_PATH }} --configuration Release --output ./publish/WmsApi

      # Upload Artifacts
      - name: Upload Order API Artifact
        uses: actions/upload-artifact@v4
        with:
          name: order-api-package
          path: ./publish/OrderApi
          include-hidden-files: true

      - name: Upload Catalog API Artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog-api-package
          path: ./publish/CatalogApi
          include-hidden-files: true

      - name: Upload WMS API Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wms-api-package
          path: ./publish/WmsApi
          include-hidden-files: true

  deploy-infrastructure:
    name: Deploy Azure Infrastructure
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep template
        shell: pwsh
        env:
          SQL_ADMIN_LOGIN: ${{ secrets.SQL_ADMIN_LOGIN }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          CATALOG_SQL_CONNECTION_STRING: ${{ secrets.CATALOG_SQL_CONNECTION_STRING }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:CATALOG_SQL_CONNECTION_STRING) {
              throw 'Set the CATALOG_SQL_CONNECTION_STRING secret before deploying infrastructure.'
          }
          $parametersFile = Join-Path $env:RUNNER_TEMP 'ecommerce-deployment.parameters.json'
          try {
              @{
                  '$schema' = 'https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#'
                  contentVersion = '1.0.0.0'
                  parameters = @{
                      sqlAdminLogin = @{ value = $env:SQL_ADMIN_LOGIN }
                      sqlAdminPassword = @{ value = $env:SQL_ADMIN_PASSWORD }
                      catalogSqlConnectionString = @{ value = $env:CATALOG_SQL_CONNECTION_STRING }
                  }
              } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $parametersFile
              az deployment group create --resource-group $env:RESOURCE_GROUP --template-file $env:BICEP_FILE_PATH --parameters "@$parametersFile" --output none
              if ($LASTEXITCODE -ne 0) { throw 'Infrastructure deployment failed.' }
          } finally {
              if (Test-Path -LiteralPath $parametersFile) { Remove-Item -LiteralPath $parametersFile }
          }

  migrate-database:
    name: Apply Catalog database migrations
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    steps:
      - name: Download Catalog database migration
        uses: actions/download-artifact@v4
        with:
          name: catalog-db-migrations
          path: ./publish/database

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Apply idempotent EF migration script
        uses: azure/sql-action@v2.4
        with:
          connection-string: ${{ secrets.CATALOG_MIGRATION_CONNECTION_STRING }}
          path: ./publish/database/catalog.sql
          arguments: -b

  deploy-functions:
    name: Deploy Azure Functions
    runs-on: ubuntu-latest
    needs: migrate-database
    steps:
      # Download Artifacts
      - name: Download Order API Artifact
        uses: actions/download-artifact@v4
        with:
          name: order-api-package
          path: ./publish/OrderApi

      - name: Download Catalog API Artifact
        uses: actions/download-artifact@v4
        with:
          name: catalog-api-package
          path: ./publish/CatalogApi

      - name: Download WMS API Artifact
        uses: actions/download-artifact@v4
        with:
          name: wms-api-package
          path: ./publish/WmsApi

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Deploy all three APIs
      - name: Deploy Order API to Azure
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.ORDER_API_NAME }}
          package: ./publish/OrderApi

      - name: Deploy Catalog API to Azure
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.CATALOG_API_NAME }}
          package: ./publish/CatalogApi

      - name: Deploy WMS API to Azure
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.WMS_API_NAME }}
          package: ./publish/WmsApi

      - name: Submit a guest order
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $orderId = 'GUEST-SMOKE-' + [Guid]::NewGuid().ToString('N')
          $email = $orderId.ToLowerInvariant() + '@example.com'
          $payload = @{ OrderId = $orderId; CustomerEmail = $email; TotalAmount = 1 } | ConvertTo-Json -Compress
          $url = "https://$($env:ORDER_API_NAME).azurewebsites.net/api/orders"
          $response = Invoke-WebRequest -Uri $url -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 60
          if ($response.StatusCode -ne 202) {
              throw "OrderApi returned HTTP $($response.StatusCode) for $orderId. Expected 202."
          }
          Write-Host "OrderApi accepted $orderId."

          # Only the GUID-derived order ID and synthetic email are interpolated.
          @"
          SET NOCOUNT ON;
          DECLARE @OrderId nvarchar(50) = N'$orderId';
          DECLARE @Email nvarchar(256) = N'$email';
          DECLARE @Deadline datetime2 = DATEADD(second, 120, SYSUTCDATETIME());

          IF OBJECT_ID(N'dbo.Customers', N'U') IS NOT NULL
              EXEC sys.sp_executesql
                  N'IF EXISTS (SELECT 1 FROM dbo.Customers WHERE Email = @Email)
                      THROW 51000, ''The smoke order email already exists in Customers.'', 1;',
                  N'@Email nvarchar(256)', @Email;

          WHILE NOT EXISTS (
              SELECT 1 FROM dbo.Orders WHERE OrderId = @OrderId AND CustomerEmail = @Email
          )
          BEGIN
              IF SYSUTCDATETIME() >= @Deadline
              BEGIN
                  DECLARE @Error nvarchar(2048) = CONCAT(N'Guest order missing from dbo.Orders: ', @OrderId);
                  THROW 51001, @Error, 1;
              END;
              WAITFOR DELAY '00:00:05';
          END;

          SELECT @OrderId AS PersistedGuestOrderId;
          "@ | Set-Content -LiteralPath ./verify-guest-order.sql

      - name: Verify the guest order in Azure SQL
        uses: azure/sql-action@v2.4
        with:
          connection-string: ${{ secrets.CATALOG_SQL_CONNECTION_STRING }}
          path: ./verify-guest-order.sql
          arguments: -b -t 150
