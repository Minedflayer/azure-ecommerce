name: Build, Deploy, and Test E-commerce Integration

on:
  push:
    branches:
      - main

env:
  DOTNET_VERSION: '8.0.x'
  RESOURCE_GROUP: 'rg-ecommerce-prod'
  # Define all three function app names
  ORDER_API_NAME: 'ecom52ekuuuicvepu-api'
  CATALOG_API_NAME: 'ecom52ekuuuicvepu-catalog-api'
  WMS_API_NAME: 'ecom52ekuuuicvepu-wms-api'
  # Define all three source paths
  ORDER_API_PATH: './src/api/OrderApi'
  CATALOG_API_PATH: './src/api/CatalogApi'
  WMS_API_PATH: './src/api/WmsApi'
  BICEP_FILE_PATH: './infra/main.bicep'

jobs:
  build-and-test:
    name: Build and Test .NET Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Build all three APIs
      - name: Build Order API
        run: dotnet build ${{ env.ORDER_API_PATH }} --configuration Release

      - name: Build Catalog API
        run: dotnet build ${{ env.CATALOG_API_PATH }} --configuration Release

      - name: Build WMS API
        run: dotnet build ${{ env.WMS_API_PATH }} --configuration Release

      # Run Unit Tests (Assuming you add a CatalogApi test project later)
      - name: Run Unit Tests
        run: |
          dotnet test ./tests/OrderApi.Tests/OrderApi.Tests.csproj --configuration Release
          dotnet test ./tests/WmsApi.Tests/WmsApi.Tests.csproj --configuration Release

      # Publish all three APIs
      - name: Publish Order API
        run: dotnet publish ${{ env.ORDER_API_PATH }} --configuration Release --output ./publish/OrderApi

      - name: Publish Catalog API
        run: dotnet publish ${{ env.CATALOG_API_PATH }} --configuration Release --output ./publish/CatalogApi

      - name: Publish WMS API
        run: dotnet publish ${{ env.WMS_API_PATH }} --configuration Release --output ./publish/WmsApi

      # Upload Artifacts
      - name: Upload Order API Artifact
        uses: actions/upload-artifact@v4
        with:
          name: order-api-package
          path: ./publish/OrderApi

      - name: Upload Catalog API Artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog-api-package
          path: ./publish/CatalogApi

      - name: Upload WMS API Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wms-api-package
          path: ./publish/WmsApi

  deploy-infrastructure:
    name: Deploy Azure Infrastructure
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep template
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: ${{ env.BICEP_FILE_PATH }}
          parameters: >-
            sqlAdminLogin=${{ secrets.SQL_ADMIN_LOGIN }}
            sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}
          failOnStdErr: false

  deploy-functions:
    name: Deploy Azure Functions
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    steps:
      # Download Artifacts
      - name: Download Order API Artifact
        uses: actions/download-artifact@v4
        with:
          name: order-api-package
          path: ./publish/OrderApi

      - name: Download Catalog API Artifact
        uses: actions/download-artifact@v4
        with:
          name: catalog-api-package
          path: ./publish/CatalogApi

      - name: Download WMS API Artifact
        uses: actions/download-artifact@v4
        with:
          name: wms-api-package
          path: ./publish/WmsApi

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Deploy all three APIs
      - name: Deploy Order API to Azure
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.ORDER_API_NAME }}
          package: ./publish/OrderApi

      - name: Deploy Catalog API to Azure
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.CATALOG_API_NAME }}
          package: ./publish/CatalogApi

      - name: Deploy WMS API to Azure
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.WMS_API_NAME }}
          package: ./publish/WmsApi

      # Post-Deployment Integration Smoke Test
      - name: Run Live Integration Tests
        shell: pwsh
        run: |
          $orderApiUrl = "https://${{ env.ORDER_API_NAME }}.azurewebsites.net/api/orders"
          $catalogApiUrl = "https://${{ env.CATALOG_API_NAME }}.azurewebsites.net/api/products"

          Write-Host "Verifying live Order API endpoint..." -ForegroundColor Cyan
          $orderPayload = @{ OrderId = "TEST-$(Get-Random)"; CustomerEmail = "ci@test.com"; TotalAmount = 100 } | ConvertTo-Json
          $orderResponse = Invoke-WebRequest -Uri $orderApiUrl -Method Post -Body $orderPayload -ContentType "application/json"
          
          if ($orderResponse.StatusCode -ne 202) {
              throw "Live Order API failed with status $($orderResponse.StatusCode)"
          }
          Write-Host "Success: Order API returned 202 Accepted" -ForegroundColor Green
