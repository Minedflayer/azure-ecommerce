name: Build and Deploy E-commerce Integration

on:
  push:
    branches:
      - main

env:
  DOTNET_VERSION: '8.0.x'
  RESOURCE_GROUP: 'rg-ecommerce-prod'
  ORDER_API_NAME: 'ecom52ekuuuicvepu-api'
  WMS_API_NAME: 'ecom52ekuuuicvepu-wms-api'
  ORDER_API_PATH: './src/api/OrderApi'
  WMS_API_PATH: './src/api/WmsApi'
  BICEP_FILE_PATH: './infra/main.bicep'

jobs:
  build-and-test:
    name: Build and Test .NET Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build Order API
        run: dotnet build ${{ env.ORDER_API_PATH }} --configuration Release

      - name: Build WMS API
        run: dotnet build ${{ env.WMS_API_PATH }} --configuration Release

      - name: Run Unit Tests
        run: dotnet test --no-build --configuration Release

      - name: Publish Order API
        run: dotnet publish ${{ env.ORDER_API_PATH }} --configuration Release --output ./publish/OrderApi

      - name: Publish WMS API
        run: dotnet publish ${{ env.WMS_API_PATH }} --configuration Release --output ./publish/WmsApi

      - name: Upload Order API Artifact
        uses: actions/upload-artifact@v4
        with:
          name: order-api-package
          path: ./publish/OrderApi

      - name: Upload WMS API Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wms-api-package
          path: ./publish/WmsApi

  deploy-infrastructure:
    name: Deploy Azure Infrastructure
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep template
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: ${{ env.BICEP_FILE_PATH }}
          parameters: >-
            sqlAdminLogin=${{ secrets.SQL_ADMIN_LOGIN }}
            sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}
          failOnStdErr: false

  deploy-functions:
    name: Deploy Azure Functions
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    steps:
      - name: Download Order API Artifact
        uses: actions/download-artifact@v4
        with:
          name: order-api-package
          path: ./publish/OrderApi

      - name: Download WMS API Artifact
        uses: actions/download-artifact@v4
        with:
          name: wms-api-package
          path: ./publish/WmsApi

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Order API to Azure
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.ORDER_API_NAME }}
          package: ./publish/OrderApi

      - name: Deploy WMS API to Azure
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.WMS_API_NAME }}
          package: ./publish/WmsApi